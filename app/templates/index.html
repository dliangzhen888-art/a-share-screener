<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b1120">
    <title>A股短线筛选器</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}">
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">A-SHARE SCREENER</p>
      <h1>A股短线筛选器</h1>
      <dl>
        <div><dt>系统状态</dt><dd><span class="dot"></span>运行正常</dd></div>
        <div><dt>当前阶段</dt><dd>完整前置筛选</dd></div>
      </dl>
      <p class="notice">两阶段低并发扫描：实时条件 → 历史指标</p>
      <form id="quote-form">
        <label for="stock-code">查询腾讯实时行情</label>
        <div class="search-row">
          <input id="stock-code" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="例如 600519" required>
          <button type="submit">查询</button>
        </div>
      </form>
      <p id="quote-message" class="message" aria-live="polite"></p>
      <section id="quote-result" class="quote" hidden>
        <h2 id="quote-name"></h2>
        <dl id="quote-fields"></dl>
      </section>
      <button id="scan-button" class="scan-button" type="button">运行完整筛选</button>
      <p id="scan-message" class="message" aria-live="polite"></p>
      <dl id="scan-stats" class="stats" hidden></dl>
      <section id="screen-results" class="results"></section>
    </main>
    <script src="{{ url_for('static', path='/app.js') }}" defer></script>
  </body>
</html>
